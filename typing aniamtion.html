<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typing aniamatiob in css</title>
    <style>
        .type{
            font-family: monospace;
            font-size: 24px;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 4s steps(22) forwards;
            border-right: 2px solid black;
        }
        @keyframes typing{
            to{width: 22ch;}
        }
    </style>
</head>
<body>
    <div class="type">typing animation in </div>
</body>
</html>
