<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filter Property</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        img {
            width: 400px;
            border-radius: 15px;

            /* CSS Filter */
            filter: brightness(80%)
                    contrast(120%)
                    saturate(150%)
                    blur(0px);
        }

        h1 {
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
            alt="Nature"
        >

        <h1>CSS Filter Effect</h1>

    </div>

</body>
</html>KO
