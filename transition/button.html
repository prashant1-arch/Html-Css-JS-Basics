<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Button</title>

    <style>
        button {
            background-color: green;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;

            /* Smooth transition */
            transition: background-color 0.5s ease;
        }

        button:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

    <button>Hover Me</button>

</body>
</html>
