<!DOCTYPE html>
<html>
<head>
    <title>CSS Transform - Scale</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background-color: skyblue;
            margin: 100px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;

            transition: transform 0.5s;
        }

        .box:hover {
            transform: scale(1.5);
        }
    </style>
</head>

<body>

    <div class="box">
        Zoom Me
    </div>

</body>
</html>
