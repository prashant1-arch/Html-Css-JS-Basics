<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Repeating Radial Gradient</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            /* Repeating Radial Gradient */
            background: repeating-radial-gradient(
                circle,
                #667eea 0px,
                #667eea 20px,
                #764ba2 20px,
                #764ba2 40px
            );
        }

        .card {
            width: 500px;
            padding: 30px;
            text-align: center;

            background: white;
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card img {
            width: 100%;
            height: 250px;

            object-fit: cover;
            border-radius: 10px;
        }

        h1 {
            margin-top: 20px;
            color: #333;
        }

        p {
            margin-top: 10px;
            color: #666;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="card">

        <img 
            src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
            alt="Nature Image"
        >

        <h1>Repeating Radial Gradient</h1>

        <p>
            This background uses repeating-radial-gradient()
            in CSS.
        </p>

    </div>

</body>
</html>
