<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repeating Linear Gradient</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Repeating Linear Gradient */
            background: repeating-linear-gradient(
                45deg,
                #667eea 0px,
                #667eea 20px,
                #764ba2 20px,
                #764ba2 40px
            );
        }

        .card {
            width: 500px;
            padding: 30px;
            text-align: center;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        h1 {
            margin: 20px 0 10px;
            color: #333;
        }

        p {
            color: #666;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Image from Internet -->
        <img 
            src="https://images.unsplash.com/photo-1519608487953-e999c86e7455"
            alt="Beautiful Mountain"
        >

        <h1>Repeating Linear Gradient</h1>

        <p>
            This background is created using
            repeating-linear-gradient() in CSS.
        </p>

    </div>

</body>
</html>
