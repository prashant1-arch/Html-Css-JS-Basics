<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Transition</title>

    <style>
        img {
            width: 100px;
            height: 100px;
            transition: width 1s ease, height 1s ease;
            align-items: center;
            justify-content: center;
            
      
        }

        img:hover {
            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>

    <img src="images/images.jpg" alt="Sample Image">

</body>
</html>
