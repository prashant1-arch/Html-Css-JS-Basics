<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <style>
      .card-container{
         display: flex;
         flex-wrap:wrap;
         gap: 20px;
      }
      .card{
         background: #fff;
         border-radius: 10px;
         box-shadow: 0 2px 8px rgba(0,0,0,0.2);
         width: 200px;
         padding: 20px;
         text-align: center;
      }
   </style>
</head>
<body>
   <div class="card-container">
      <div class="card">card 2</div>
      <div class="card">card 3</div>
   </div>
</body>
</html>
