<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Overlay on Image</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #222;
        }

        .image-box {
            width: 600px;
            height: 350px;
            position: relative;
            overflow: hidden;
            border-radius: 15px;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Color Overlay */
        .image-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background-color: rgba(0, 100, 255, 0.5);
        }

        /* Text on Image */
        .content {
            position: absolute;
            z-index: 2;
            color: white;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .content h1 {
            font-size: 40px;
        }

        .content p {
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="image-box">

        <img 
            src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
            alt="Nature Image"
        >

        <div class="content">
            <h1>Beautiful Nature</h1>
            <p>Color Overlay using CSS</p>
        </div>

    </div>

</body>
</html>
